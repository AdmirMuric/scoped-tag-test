name: token-test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          P=.github/workflows/reusable.yml
          blob() { jq -n --arg c "$1" '{content:$c,encoding:"utf-8"}' | gh api repos/$R/git/blobs --input - --jq .sha; }
          commit() { # blob parent message
            tree=$(jq -n --arg p "$P" --arg s "$1" '{tree:[{path:$p,mode:"100644",type:"blob",sha:$s}]}' | gh api repos/$R/git/trees --input - --jq .sha)
            jq -n --arg t "$tree" --arg m "$3" --arg parent "$2" '{message:$m,tree:$t,parents:(if $parent=="" then [] else [$parent] end)}' | gh api repos/$R/git/commits --input - --jq .sha
          }
          try() { echo "--- $1"; shift; "$@" >/dev/null 2>/tmp/err && echo OK || { echo FAILED; cat /tmp/err; }; }
          main=$(gh api "repos/$R/git/trees/$GITHUB_SHA?recursive=1" --jq ".tree[]|select(.path==\"$P\")|.sha")
          novel=$(blob "name: novel $GITHUB_RUN_ID
          on: workflow_call
          jobs: {}
          ")
          old=$(commit $novel "" "old version, content not on main")
          try "release: old version, novel content, no parent" gh api repos/$R/releases -f tag_name=test/novel-$GITHUB_RUN_ID -f target_commitish=$old
          new=$(commit $main $old "new version, main content, parent has other content")
          try "release: main content on top of a different parent" gh api repos/$R/releases -f tag_name=test/chain-$GITHUB_RUN_ID -f target_commitish=$new
          new2=$(commit $novel "" "novel again for ref test $GITHUB_RUN_ID")
          try "create tag ref: novel content" gh api repos/$R/git/refs -f ref=refs/tags/test/novel-ref-$GITHUB_RUN_ID -f sha=$new2
