name: token-test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          X: d4e39f32ee93d2bbc485ddbacf34acd86fa1db78
        run: |
          P=.github/workflows/reusable.yml
          try() { echo "--- $1"; shift; "$@" 2>/tmp/err && echo OK || { echo FAILED; cat /tmp/err; }; }
          entry=$(gh api "repos/$R/git/trees/$GITHUB_SHA?recursive=1" --jq ".tree[]|select(.path==\"$P\")|{mode,type,sha}")
          try "create tree with main's content" bash -c "jq -n --arg p $P --argjson e '$entry' '{tree:[{path:\$p,mode:\$e.mode,type:\$e.type,sha:\$e.sha}]}' | gh api repos/$R/git/trees --input - --jq .sha > /tmp/tree"
          tree=$(cat /tmp/tree)
          try "create commit on top of previous version" bash -c "jq -n --arg t $tree --arg p $X '{message:\"new version\",tree:\$t,parents:[\$p]}' | gh api repos/$R/git/commits --input - --jq .sha > /tmp/y"
          y=$(cat /tmp/y); echo "new version commit $y"
          try "diff new vs previous" gh api repos/$R/compare/$X...$y --jq '[.files[]|.filename+" "+.status]'
          try "release on unreferenced commit" gh api repos/$R/releases -f tag_name=test/new-rel-$GITHUB_RUN_ID -f target_commitish=$y --jq .tag_name
          try "create tag ref instead" gh api repos/$R/git/refs -f ref=refs/tags/test/new-ref-$GITHUB_RUN_ID -f sha=$y --jq .ref
          try "release on that existing tag" gh api repos/$R/releases -f tag_name=test/new-ref-$GITHUB_RUN_ID --jq .tag_name
          try "move a floating tag to it" gh api -X PATCH repos/$R/git/refs/tags/test/prev-real -f sha=$y -F force=true --jq .object.sha
